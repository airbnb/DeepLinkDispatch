apply plugin: 'com.android.library'
apply plugin: 'checkstyle'

apply from: '../publishing.gradle'
apply plugin: 'org.jmailen.kotlinter'

dependencies {
  api project(':deeplinkdispatch-base')
  implementation deps.okio
  implementation deps.jsr305
  implementation deps.localBroadcastManager
  implementation deps.appCompat
  testImplementation deps.mockk
  testImplementation deps.junit
  testImplementation deps.assertJ
}

checkstyle {
  configFile = rootProject.file('checkstyle.xml')
  showViolations = true
  configProperties = ['checkstyle.cache.file': rootProject.file('build/checkstyle.cache')]
}

android {
    namespace = 'com.airbnb.android.deeplinkdispatch'
    compileSdk {
        version = release(androidConfig.compileSdkVersion) {
            it.minorApiLevel = androidConfig.compileSdkMinorVersion
        }
    }
    buildToolsVersion = androidConfig.buildToolsVersion

    defaultConfig {
        minSdk = androidConfig.minSdkVersion
        targetSdk = androidConfig.targetSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    consumerProguardFiles 'proguard-rules.pro'
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}
