name: Build/Test

on:
  # Trigger on every pull request
  pull_request:
  # This is reused in deploy_snapshot.yml
  workflow_call:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DeepLinkDispatch
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '25'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - name: Build/Test DeepLinkDispatch
        run: ./gradlew assemble assembleAndroidTest check javadoc lintKotlin
